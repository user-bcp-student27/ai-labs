quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.database.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.seed-demo-users=false
%dev.auth.seed-demo-users=true
%test.auth.seed-demo-users=true
%prod.auth.seed-demo-users=false
smallrye.jwt.new-token.signature-algorithm=RS256
%dev.smallrye.jwt.sign.key.location=${AUTH_TOKEN_SIGNING_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${AUTH_TOKEN_SIGNING_KEY_LOCATION}
